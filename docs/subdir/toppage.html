        body {

            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            /* --- ここまで --- */
            color: #333;
            margin: 0;
            padding: 2% 5%;
        }

        /* --- 動く背景のアニメーション定義 --- */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* --- ここまで --- */

        h1 {
            font-size: 2.5em;
            color: #fff; /* 背景が濃いため白文字に変更 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); /* 影を少し濃く */
        }
        h2 {
            border-bottom: 2px solid #fff;
            display: inline-block;
            padding-bottom: 5px;
            margin-top: 40px;
            color: #fff;
        }
        h6 {
            color: #f0f0f0;
            font-weight: normal;
        }

        .text-container {
            font-size: 1.2em;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.3); /* 背景色を追加して読みやすく */
            border-radius: 10px;
            padding: 20px;
            margin: 30px auto;
            max-width: 800px;
            line-height: 1.6;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        .visible {
            opacity: 1;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 90%;
            margin: 40px auto;
            text-align: left;
        }
        .content-card {
            background-color: rgba(255, 255, 255, 0.9); /* 少し透明にして背景と馴染ませる */
            backdrop-filter: blur(5px); /* ガラスのような効果 */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card-category {
            font-weight: bold;
            color: #0056b3;
            background-color: #e6f7ff;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .card-link {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card-link a {
            text-decoration: none;
            color: #007bff;
            transition: color 0.3s ease;
        }
        .card-link a:hover {
            color: #0056b3;
        }
        .card-description {
            color: #555;
            flex-grow: 1;
            margin-bottom: 15px;
        }
        
        /* ▼▼▼ ここから追加したCSS ▼▼▼ */
        summary {
            cursor: pointer; /* クリックできることを示すカーソルに変更 */
            list-style: none; /* デフォルトのマーカー（▶）を非表示 */
        }
        summary::-webkit-details-marker {
            display: none; /* Safari/Chrome用のマーカー非表示 */
        }
        details > summary > h2::after {
            content: ' (Click to Expand)'; /* 閉じた状態のテキスト */
            font-size: 0.7em;
            color: #f0f0f0;
        }
        details[open] > summary > h2::after {
            content: ' (Click to Collapse)'; /* 開いた状態のテキスト */
        }
        /* ▲▲▲ ここまで追加したCSS ▲▲▲ */

        function createContentCards(dataArray, containerId) {
            const gridContainer = document.getElementById(containerId);

            dataArray.forEach(data => {
                const cardHTML = `
                    <div class="content-card">
                        <div>

                            <div class="card-link"><a href="${data.link}">${data.linkText}</a></div>
                            <div class="card-description">${data.description}</div>
                        </div>
                    </div>
                `;
                gridContainer.innerHTML += cardHTML;
            });
        }

        function fadeInText(text, containerId, delay) {
            const container = document.getElementById(containerId);
            text.split("").forEach((char, index) => {
                const span = document.createElement("span");
                span.textContent = char;
                span.classList.add("fade-in");
                container.appendChild(span);

                setTimeout(() => {
                    span.classList.add("visible");
                }, index * delay);
            });
        }
