<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNKO - Knowledge for the World</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            /* --- 動く背景グラデーション --- */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            /* --- ここまで --- */
            color: #333;
            margin: 0;
            padding: 2% 5%;
        }

        /* --- 動く背景のアニメーション定義 --- */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* --- ここまで --- */

        h1 {
            font-size: 2.5em;
            color: #fff; /* 背景が濃いため白文字に変更 */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3); /* 影を少し濃く */
        }
        h2 {
            border-bottom: 2px solid #fff;
            display: inline-block;
            padding-bottom: 5px;
            margin-top: 40px;
            color: #fff;
        }
        h6 {
            color: #f0f0f0;
            font-weight: normal;
        }

        .text-container {
            font-size: 1.2em;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.3); /* 背景色を追加して読みやすく */
            border-radius: 10px;
            padding: 20px;
            margin: 30px auto;
            max-width: 800px;
            line-height: 1.6;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        .visible {
            opacity: 1;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 90%;
            margin: 40px auto;
            text-align: left;
        }
        .content-card {
            background-color: rgba(255, 255, 255, 0.9); /* 少し透明にして背景と馴染ませる */
            backdrop-filter: blur(5px); /* ガラスのような効果 */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card-category {
            font-weight: bold;
            color: #0056b3;
            background-color: #e6f7ff;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .card-link {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card-link a {
            text-decoration: none;
            color: #007bff;
            transition: color 0.3s ease;
        }
        .card-link a:hover {
            color: #0056b3;
        }
        .card-description {
            color: #555;
            flex-grow: 1;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>Knowledge Portal</h1>
    <div id="en" class="text-container"></div>
    <h2><b><u>The all content of share is below</u></b></h2>
    <h6>Click the LinkPage to see the contents<br>
    These contents are made from AI tools.</h6>

    <!-- カードがJavaScriptによって動的に挿入されるコンテナ -->
    <div class="content-grid" id="content-grid-container"></div>

    <script>
        // --- コンテンツデータを配列として定義 ---
        const allData = [
            { category: 'Terraform', link: 'terraform_aws_outputs/aws_output.html', linkText: '★terraform awsoutput', description: 'terraform awsoutput' },
            { category: 'Baby', link: 'share/donoteat_pregnant.html', linkText: '★Do not eat pregnant', description: 'Do not eat during pregnancy' },
            { category: 'Development Blogs', link: 'development/k3d_self_arch.html', linkText: '★k3d_self_arch', description: 'Self-architecture of k3d' },
            { category: 'Games', link: 'development/games_tetris.html', linkText: '★games_tetris', description: 'Games tetris' },
            { category: 'Games', link: 'development/games_minecraf.html', linkText: '×games_minecraf', description: 'Games minecraf' },
            { category: 'Tools', link: 'development/tools_drawing.html', linkText: 'drawing PC', description: 'Drawing Free with PC site (No Need Paint!)' },
            { category: 'Tools', link: 'development/tools_drawing_withtap.html', linkText: '★drawing smartphone', description: 'Drawing Free with smartphone site (No Need Paint!)' },
            { category: 'Tools', link: 'development/tools_drawing3d_withtap.html', linkText: '★drawing 3d smartphone', description: 'Drawing 3d Free with smartphone site (No Need Paint!)' },
            { category: 'Tools', link: 'development/tools_stocks.html', linkText: 'confirm stocks', description: 'Stocks site' },
            { category: 'Tools', link: 'development/tools_sleepwrite.html', linkText: 'sleepwrite', description: 'Sleepwrite' },
            { category: 'Tools', link: 'development/tools_babytest001.html', linkText: '★badyRecord', description: 'bady the record' },
            { category: 'Tools', link: 'development/tools_cooking.html', linkText: '★CookingGrow', description: 'Cooking of the recipes' },
            { category: 'Tools', link: 'development/tools_cooking_v2.html', linkText: 'CookingWithWays', description: 'Cooking of the recipes with manuals' },
            { category: 'Test', link: 'test/testhtml001.html', linkText: 'test', description: 'test' },
            { category: 'Weather', link: 'share/weathernews.html', linkText: '×weathernews', description: 'weathernews world' },
            { category: 'weather', link: 'share/weathernewsjp.html', linkText: '×weathernews', description: 'weathernews Japan' },
            { category: 'Tools' , link: 'development/tools_qr_generations.html', linkText: '★QR Generations', description: 'QR code generation tool' },
            { category: 'Games', link: 'trial_features/games_worldtrackfield.html', linkText: '★games_World100mFinal', description: 'Games World track and field' },
            { category: 'Tools', link: 'trial_features/tools_wbs_generations.html', linkText: '★tools wbs Generations', description: 'WBS Generations' },
            { category: 'Tools', link: 'trial_features/tools_receipt_ocr.html', linkText: '★tools OCR Generations text', description: 'The OCR of Picture to text' }
            
        ];

        // --- データからカードを動的に生成する処理 ---
        const gridContainer = document.getElementById('content-grid-container');
        allData.forEach(data => {
            const cardHTML = `
                <div class="content-card">
                    <div>
                        <div class="card-category">${data.category}</div>
                        <div class="card-link"><a href="${data.link}">${data.linkText}</a></div>
                        <div class="card-description">${data.description}</div>
                    </div>
                </div>
            `;
            gridContainer.innerHTML += cardHTML;
        });
        // --- ここまで ---

        const texts = {
            en: "The server construction that started 10 years ago. \
            The approach to server construction has shifted from mere manufacturing to considering what can be achieved through the server. \
            Today, we are in an era where AI, Cloud, and Big Data fields are growing rapidly. \
            It is essential to solve social issues through the utilization of data. UNKO - Unknown Numeric Knowledge Owner - seeks to acquire infinite unknown knowledge and share it with the world!",
        };

        function fadeInText(text, containerId, delay) {
            const container = document.getElementById(containerId);
            text.split("").forEach((char, index) => {
                const span = document.createElement("span");
                span.textContent = char;
                span.classList.add("fade-in");
                container.appendChild(span);

                setTimeout(() => {
                    span.classList.add("visible");
                }, index * delay);
            });
        }
        fadeInText(texts.en, "en", 10);
    </script>
</body>
</html>
