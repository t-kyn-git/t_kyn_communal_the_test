<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNKO - Knowledge for the World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 5%;
        }
        .text-container {
            font-size: 1.5em;
            color: black;
            margin-bottom: 40px;
        }
        .fade-in {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        .visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>Knowledge Portal</h1>
    <div id="en" class="text-container"></div>
    <h2><b><u>The all content of share is below</b></u></h2>
    <table border="1" style="width: 80%; margin: 20px auto; border-collapse: collapse;">
        <tr>
            <th>Content Type</th>
            <th>LinkPage</th>
            <th>Description</th>
        </tr>
        <tr>
            <td>Baby</td>
            <td><a href="share/donoteat_pregnant.html">Do not eat pregnant</a></td>
            <td>Do not eat during pregnancy</td>
        </tr>
        <tr>
            <td>Development</td>
            <td><a href="development/k3d_self_arch.html">k3d_self_arch.html</a></td>
            <td>Self-architecture of k3d</td>
        </tr>

    <script>
        const texts = {
            en: "The server construction that started 10 years ago. \
            The approach to server construction has shifted from mere manufacturing to considering what can be achieved through the server. \
            Today, we are in an era where AI, Cloud, and Big Data fields are growing rapidly. \
            It is essential to solve social issues through the utilization of data. UNKO - Unknown Numeric Knowledge Owner - seeks to acquire infinite unknown knowledge and share it with the world!",
        };

        // 各言語に対して1文字ずつフェードインさせる関数
        function fadeInText(text, containerId, delay) {
            const container = document.getElementById(containerId);
            text.split("").forEach((char, index) => {
                const span = document.createElement("span");
                span.textContent = char;
                span.classList.add("fade-in");
                container.appendChild(span);

                // 0.1秒ごとにフェードイン
                setTimeout(() => {
                    span.classList.add("visible");
                }, index * delay);
            });
        }
        fadeInText(texts.en, "en", 10);
    </script>
</body>
</html>
