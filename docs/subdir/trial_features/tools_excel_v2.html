<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HTML 完結 スプレッドシート（最終改善版）</title>
<style>
  :root{
    --header-height:48px;
    --cell-width:100px;
    --cell-height:28px;
    --font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  body{font-family:var(--font-family);margin:0;background:#f6f7f9;color:#111}
  .toolbar{
    height:var(--header-height);
    display:flex;align-items:center;gap:8px;padding:6px 10px;
    background:#fff;border-bottom:1px solid #ddd;
  }
  .toolbar button, .toolbar select{
    height:34px;padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff;
    cursor:pointer;font-size:13px;
  }
  .container{display:flex;height:calc(100vh - var(--header-height));overflow:auto}
  .sheet{flex:1;margin:12px;background:#fff;border:1px solid #ddd;overflow:auto;padding:12px;}
  table{border-collapse:collapse;min-width:600px;user-select:none;}
  th, td{border:1px solid #e1e4e8;width:var(--cell-width);height:var(--cell-height);position: relative;}
  th{background:#f3f6f9;font-weight:600;text-align:center;font-size:12px}
  .cell{width:100%;height:100%;display:block;padding:4px;font-size:13px;outline:none;line-height: 1.5;}
  .selected{background:rgba(0,120,215,0.1)}
  .fill-handle{position:absolute;width:6px;height:6px;background:#0078d7;bottom:-3px;right:-3px;cursor:crosshair; z-index: 10;}
  .footer-note{padding:6px 12px;font-size:12px;color:#666}
</style>
</head>
<body>
  <div class="toolbar">
    <strong>HTML Spreadsheet</strong>
    <button id="btnNew">New</button>
    <button id="btnSaveXlsx">Save .xlsx</button>
    <button id="btnSaveCsv">Save .csv</button>
    <button id="btnGraph">グラフ作成</button>
    <select id="drawShape">
      <option value="">図形</option>
      <option value="rect">四角形</option>
      <option value="circle">円</option>
    </select>
  </div>

  <div class="container">
    <div class="sheet">
      <table id="grid"></table>
      <div class="footer-note">Enterで下方セルへ / 範囲コピペ対応 / SUM関数 / オートフィル / グラフ&図形</div>
    </div>
    <div style="flex:0.6;padding:12px;">
      <canvas id="chartCanvas" width="400" height="200"></canvas>
      <hr>
      <canvas id="shapeCanvas" width="400" height="200" style="border:1px solid #ccc"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const DEFAULT_ROWS=20, DEFAULT_COLS=10;
let rows=DEFAULT_ROWS, cols=DEFAULT_COLS;
let data=Array.from({length:rows},()=>Array(cols).fill(""));

const grid=document.getElementById("grid");
let selection = {start:{r:0,c:0}, end:{r:0,c:0}};
let isSelecting = false;
let isAutofilling = false;
let startFill = null;
let myChart = null;

function colLabel(n){let s="";while(n>=0){s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)-1;}return s;}

function evaluateCell(expr, r, c){
  if(typeof expr!=="string") return expr;
  if(expr.startsWith("=")){
    try{
      const f=expr.slice(1).toUpperCase();
      if(f.startsWith("SUM(")){
        const range=f.match(/SUM\(([^)]+)\)/)[1];
        const [a,b]=range.split(":");
        const coord=(addr)=>{const col=addr.match(/[A-Z]+/)[0];const row=parseInt(addr.match(/\d+/)[0])-1;
          let colIdx=0;for(let i=0;i<col.length;i++){colIdx=colIdx*26+(col.charCodeAt(i)-64);}return{r:row,c:colIdx-1};};
        const s=coord(a), e=coord(b);
        let sum=0;
        for(let r=s.r;r<=e.r;r++)for(let c=s.c;c<=e.c;c++){const v=parseFloat(data[r][c]);if(!isNaN(v))sum+=v;}
        return sum;
      }
    }catch{return"#ERR";}
  }
  return expr;
}

function updateCellDisplay() {
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const cellDiv = grid.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if (cellDiv) {
                cellDiv.innerText = evaluateCell(data[r][c], r, c);
            }
        }
    }
}

function render(){
  grid.innerHTML="";
  const thead=document.createElement("thead");
  const trh=document.createElement("tr");
  trh.appendChild(document.createElement("th"));
  for(let c=0;c<cols;c++){const th=document.createElement("th");th.textContent=colLabel(c);trh.appendChild(th);}
  thead.appendChild(trh);grid.appendChild(thead);

  const tbody=document.createElement("tbody");
  for(let r=0;r<rows;r++){
    const tr=document.createElement("tr");
    const th=document.createElement("th");th.textContent=r+1;tr.appendChild(th);
    for(let c=0;c<cols;c++){
      const td=document.createElement("td");
      const div=document.createElement("div");
      div.className="cell";div.contentEditable=true;div.dataset.r=r;div.dataset.c=c;
      div.innerText=evaluateCell(data[r][c], r, c);
      div.addEventListener("input", (e) => { data[r][c] = e.target.innerText; });
      div.addEventListener('blur', updateCellDisplay);
      
      // ★修正点: Enterキーで下のセルに移動
      div.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault(); // デフォルトの改行動作をキャンセル
              const nextR = r + 1;
              if (nextR < rows) {
                  selection = { start: { r: nextR, c }, end: { r: nextR, c } };
                  updateSelectionHighlight();
                  grid.querySelector(`.cell[data-r="${nextR}"][data-c="${c}"]`).focus();
              }
          }
      });
      td.appendChild(div);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  grid.appendChild(tbody);
  updateSelectionHighlight();
}

function updateSelectionHighlight(){
  document.querySelectorAll(".cell.selected").forEach(el=>el.classList.remove("selected"));
  document.querySelectorAll(".fill-handle").forEach(el => el.remove());

  const r_start = Math.min(selection.start.r, selection.end.r);
  const r_end = Math.max(selection.start.r, selection.end.r);
  const c_start = Math.min(selection.start.c, selection.end.c);
  const c_end = Math.max(selection.start.c, selection.end.c);

  for(let r=r_start; r<=r_end; r++){
    for(let c=c_start; c<=c_end; c++){
      const cell = grid.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
      if(cell) cell.classList.add("selected");
    }
  }

  const lastSelectedCell = grid.querySelector(`.cell[data-r="${selection.end.r}"][data-c="${selection.end.c}"]`);
  if(lastSelectedCell){
      const h = document.createElement("div"); h.className = "fill-handle";
      h.addEventListener("mousedown", (e) => {
          isAutofilling = true; startFill = { r: selection.end.r, c: selection.end.c }; e.stopPropagation();
      });
      lastSelectedCell.parentElement.appendChild(h);
  }
}

grid.addEventListener("mousedown", (e) => {
    if (e.target.classList.contains('cell')) {
        isSelecting = true;
        const r = +e.target.dataset.r; const c = +e.target.dataset.c;
        selection = { start: { r, c }, end: { r, c } };
        updateSelectionHighlight();
    }
});
grid.addEventListener("mousemove", (e) => {
    if (isSelecting && e.target.classList.contains('cell')) {
        const r = +e.target.dataset.r; const c = +e.target.dataset.c;
        selection.end = { r, c }; updateSelectionHighlight();
    } else if (isAutofilling && e.target.classList.contains('cell')) {
        const r_end = +e.target.dataset.r; const c_end = +e.target.dataset.c;
        const r_start = startFill.r; const c_start = startFill.c;
        if (c_end === c_start) {
            const val = data[r_start][c_start];
            for (let r = r_start + 1; r <= r_end; r++) { data[r][c_start] = val; }
        }
        render(); selection.end = { r: r_end, c: c_end }; updateSelectionHighlight();
    }
});
document.addEventListener("mouseup", () => { isSelecting = false; isAutofilling = false; });

// ★修正点: コピー＆ペースト機能
document.addEventListener('copy', (e) => {
    e.preventDefault();
    const r_start = Math.min(selection.start.r, selection.end.r);
    const r_end = Math.max(selection.start.r, selection.end.r);
    const c_start = Math.min(selection.start.c, selection.end.c);
    const c_end = Math.max(selection.start.c, selection.end.c);
    
    let copyText = "";
    for(let r = r_start; r <= r_end; r++){
        let rowText = [];
        for(let c = c_start; c <= c_end; c++){
            rowText.push(data[r][c] || "");
        }
        copyText += rowText.join("\t") + "\n";
    }
    navigator.clipboard.writeText(copyText.trim());
});

document.addEventListener('paste', async (e) => {
    e.preventDefault();
    const pasteText = await navigator.clipboard.readText();
    const pasteRows = pasteText.split("\n").map(row => row.split("\t"));
    
    const start_r = selection.start.r;
    const start_c = selection.start.c;

    pasteRows.forEach((row, r_offset) => {
        row.forEach((cellValue, c_offset) => {
            const r = start_r + r_offset;
            const c = start_c + c_offset;
            if (r < rows && c < cols) {
                data[r][c] = cellValue;
            }
        });
    });
    updateCellDisplay();
});

// 新規・保存ボタン
btnNew.addEventListener("click",()=>{rows=DEFAULT_ROWS;cols=DEFAULT_COLS; data=Array.from({length:rows},()=>Array(cols).fill(""));render();});
btnSaveXlsx.addEventListener("click",()=>{
  const evaluatedData = data.map((row, r) => row.map((cell, c) => evaluateCell(cell, r, c)));
  const ws=XLSX.utils.aoa_to_sheet(evaluatedData);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Sheet1"); XLSX.writeFile(wb, "sheet.xlsx");
});
btnSaveCsv.addEventListener("click",()=>{
  const evaluatedData = data.map((row, r) => row.map((cell, c) => evaluateCell(cell, r, c)));
  const csv=evaluatedData.map(r=>r.map(c=>`"${c}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8,"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);a.download="sheet.csv";a.click();
});

// グラフ作成
btnGraph.addEventListener("click",()=>{
  if(myChart){ myChart.destroy(); }
  const labels=[],values=[];
  for(let r=0;r<rows;r++){
      if(data[r][0] && !isNaN(evaluateCell(data[r][1],r,1))){
          labels.push(data[r][0]); values.push(+evaluateCell(data[r][1],r,1));
      }
  }
  myChart = new Chart(document.getElementById("chartCanvas"),{
    type:"bar", data:{labels,datasets:[{label:"データ",data:values,backgroundColor:"rgba(54,162,235,0.5)"}]}
  });
});

// 図形描画
const sctx=document.getElementById("shapeCanvas").getContext("2d");
document.getElementById("shapeCanvas").addEventListener("click",(e)=>{
  const type=document.getElementById("drawShape").value;if(!type)return;
  const rect=e.target.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;
  sctx.fillStyle = "#333";
  if(type==="rect"){sctx.fillRect(x-20,y-20,40,40);}
  if(type==="circle"){sctx.beginPath();sctx.arc(x,y,20,0,Math.PI*2);sctx.fill();}
});

render();
</script>
</body>
</html>
