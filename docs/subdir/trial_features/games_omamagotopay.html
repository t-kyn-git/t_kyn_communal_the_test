<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おままごとPay</title>
    <style>
        /* 全体のスタイル */
        body {
            font-family: 'Hiragino Sans', 'ヒラギノ角ゴシック', 'Meiryo', 'メイリオ', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            -webkit-user-select: none; /* テキストの選択を無効化 */
            user-select: none;
        }

        /* スマートフォン風のコンテナ */
        .container {
            width: 360px;
            height: 640px;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 金額表示エリア */
        .display-area {
            background-color: #4CAF50;
            color: white;
            padding: 40px 20px 20px;
            text-align: right;
        }
        .display-area h1 {
            margin: 0;
            font-size: 48px;
            font-weight: bold;
        }

        /* 電卓ボタンエリア */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background-color: #ccc;
            flex-grow: 1;
        }
        .keypad button {
            background-color: #fff;
            border: none;
            font-size: 28px;
            padding: 20px 0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .keypad button:active {
            background-color: #e0e0e0;
        }
        .keypad .zero-button {
            grid-column: span 2;
        }

        /* 支払いボタン */
        .payment-button {
            grid-column: span 3;
            background-color: #ff5722;
            color: rgb(206, 208, 72);
            font-size: 24px;
            font-weight: bold;
            border: none;
            padding: 20px 0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .payment-button:active {
            background-color: #e64a19;
        }
        
        /* 支払い完了画面 */
        #complete-screen {
            display: none; /* 最初は非表示 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #4CAF50;
            color: white;
            height: 100%;
        }
        #complete-screen h2 {
            font-size: 36px;
            margin-bottom: 30px;
        }
        #complete-screen p {
            font-size: 18px;
        }
        #complete-screen .back-button {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 18px;
            border: 2px solid white;
            background-color: transparent;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #complete-screen .back-button:active {
            background-color: rgba(255, 255, 255, 0.2);
        }
        footer {
            text-align: center; /* この一行がテキストを中央揃えにします */
            background: #f0f0f0;
            padding: 1rem;
            font-size: .5rem;
            margin-top: 2rem;
        }
    </style>
</head>

    <div class="container">
        <!-- 金額入力画面 -->
        <div id="payment-screen">
            <div class="display-area">
                <h1 id="amount-display">0</h1>
            </div>
            <div class="keypad">
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>

                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button onclick="clearAmount()">C</button>
                <button class="zero-button" onclick="appendNumber('0')">0</button>
                <button class="payment-button" onclick="processPayment()">おしはらい</button>
            </div>
        </div>
        <footer>
        This is the t_kyn systems of shered contents<br>
        これは、てすとようです。じっさいのおかねのしはらいではありません。<br>
        </footer>
        <!-- 支払い完了画面 -->
        <div id="complete-screen">
            <h2>おしはらい かんりょう！</h2>
            <p>ありがとうございました！</p>
            <button class="back-button" onclick="goBack()">さいしょにもどる</button>
        </div>
    </div>

    <script>
        // 必要なHTML要素を取得
        const paymentScreen = document.getElementById('payment-screen');
        const completeScreen = document.getElementById('complete-screen');
        const amountDisplay = document.getElementById('amount-display');
        const paymentSound = document.getElementById('payment-sound');

        let currentAmount = '0'; // 現在の入力金額を文字列として保持

        // 金額の表示を更新する関数
        function updateDisplay() {
            // 3桁ごとにカンマを入れる
            amountDisplay.textContent = Number(currentAmount).toLocaleString();
        }

        // 数字ボタンが押されたときの関数
        function appendNumber(number) {
            // 9桁を超える場合は入力を無視
            if (currentAmount.length >= 9) {
                return;
            }
            if (currentAmount === '0') {
                currentAmount = number;
            } else {
                currentAmount += number;
            }
            updateDisplay();
        }

        // C（クリア）ボタンが押されたときの関数
        function clearAmount() {
            currentAmount = '0';
            updateDisplay();
        }

        // 「おしはらい」ボタンが押されたときの関数
        function processPayment() {
            if (currentAmount === '0') {
                // 金額が0の場合は何もしない
                return;
            }
            // 決済音を再生
            paymentSound.currentTime = 0; // 再生位置を最初に戻す
            paymentSound.play();

            // 画面を切り替え
            paymentScreen.style.display = 'none';
            completeScreen.style.display = 'flex';
        }

        // 「さいしょにもどる」ボタンが押されたときの関数
        function goBack() {
            // 金額をリセット
            clearAmount();
            // 画面を切り替え
            paymentScreen.style.display = 'block';
            completeScreen.style.display = 'none';
        }

    </script>
