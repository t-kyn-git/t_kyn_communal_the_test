<!doctype html>
<html><meta charset="utf-8"><title>Password</title><body>
<h1>パスワード生成</h1>
<h1>このhtmlはパスワードポリシーも自在に設定して生成できるようにしないとダメなのでは・・・</h1>
<input id="len" type="number" value="16" min="4"><button id="gen">生成</button>
<div id="out"></div>
<script>
const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()-_=+";
document.getElementById('gen').onclick=()=>{
  const l=Number(document.getElementById('len').value||16);
  let s='';
  for(let i=0;i<l;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('out').textContent=s;
};
</script>
<div style="text-align:center;"><button onclick="history.back()" style="font-size:18px; padding:10px 20px;">BACK</button></div>
</body></html>
