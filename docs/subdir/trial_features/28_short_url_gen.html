<!doctype html>
<html><meta charset="utf-8"><title>ShortID</title><body>
<h1>短縮コード生成（ローカル）</h1>
<h1>なんで6文字で固定なの？センスないですね・・・・・</h1>
<input id="url" placeholder="任意のテキスト/URL"><button id="g">作成</button>
<ul id="list"></ul>
<script>
const K='shorts'; function get(){return JSON.parse(localStorage.getItem(K)||'{}');}
document.getElementById('g').onclick=()=>{ const u=document.getElementById('url').value; if(!u) return; const id=Math.random().toString(36).slice(2,8); const db=get(); db[id]=u; localStorage.setItem(K,JSON.stringify(db)); render();}
function render(){ const db=get(); const ul=document.getElementById('list'); ul.innerHTML=''; for(const k in db){ const li=document.createElement('li'); li.textContent=`${k} -> ${db[k]}`; ul.appendChild(li);} }
render();
</script>
</body></html>
