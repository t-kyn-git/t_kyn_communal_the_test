<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>高機能Markdownプレビュー</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
    h1, h2 { border-bottom: 2px solid #ccc; padding-bottom: 10px; }
    .container { display: flex; gap: 20px; }
    textarea, .preview-container { width: 48%; height: 600px; box-sizing: border-box; border: 1px solid #ccc; font-size: 16px; padding: 10px; }
    textarea { resize: vertical; }
    .preview-container { overflow: auto; background-color: #fff; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background-color: #f2f2f2; }
    pre { background-color: #eee; padding: 10px; border-radius: 5px; }
    code { font-family: monospace; }
    blockquote { border-left: 5px solid #ccc; padding-left: 10px; color: #666; }
  </style>
</head>
<body>
  <h1>高機能 Markdown プレビュー (Mermaid & PlantUML対応)</h1>
  <p>左側のテキストエリアにMarkdownを記述すると、右側にリアルタイムでプレビューが表示されます。</p>

  <div class="container">
    <textarea id="md"></textarea>
    <div id="out" class="preview-container"></div>
  </div>

  <!-- 必要なライブラリをCDNから読み込み -->
  <!-- Marked.js (Markdownパーサー) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Mermaid.js (Mermaid作図) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <!-- pako.js (PlantUMLのエンコード用) -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

  <script>
    // PlantUMLのテキストをエンコードする関数
    function encodePlantUML(text) {
      const encoded = pako.deflate(unescape(encodeURIComponent(text)), { to: 'string' });
      let result = '';
      for (let i = 0; i < encoded.length; i++) {
        const charCode = encoded.charCodeAt(i);
        if (charCode >= 0 && charCode < 128) {
           result += '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_'.charAt(charCode & 0x3F)
                   + '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_'.charAt((charCode >> 6) & 0x3F);
        } else {
           result += '%' + charCode.toString(16).padStart(2, '0');
        }
      }
      // Base64風のエンコード
      return btoa(encoded)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }
    
    // PlantUMLのテキストをエンコードする関数(公式ドキュメント準拠)
    function encodePlantUMLOfficial(plantUmlText) {
        // 1. UTF-8にエンコード
        // 2. Deflateで圧縮
        const compressed = pako.deflate(unescape(encodeURIComponent(plantUmlText)), { level: 9 });
        // 3. Base64に似たカスタムエンコーディング
        let encoded = '';
        const b64 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_';
        for (let i = 0; i < compressed.length; i += 3) {
            const byte1 = compressed[i];
            const byte2 = i + 1 < compressed.length ? compressed[i + 1] : 0;
            const byte3 = i + 2 < compressed.length ? compressed[i + 2] : 0;

            const chunk = (byte1 << 16) | (byte2 << 8) | byte3;

            encoded += b64.charAt((chunk >> 18) & 63) +
                       b64.charAt((chunk >> 12) & 63) +
                       b64.charAt((chunk >> 6) & 63) +
                       b64.charAt(chunk & 63);
        }
        return encoded.substring(0, encoded.length - (3 - (compressed.length % 3)) % 3);
    }


    // Marked.jsのレンダラーをカスタマイズ
    const renderer = new marked.Renderer();
    const originalCodeRenderer = renderer.code;

    renderer.code = function(code, language) {
      if (language === 'mermaid') {
        return `<div class="mermaid">${code}</div>`;
      }
      if (language === 'plantuml') {
        const encoded = encodePlantUMLOfficial(code);
        const plantUmlUrl = `http://www.plantuml.com/plantuml/svg/${encoded}`;
        return `<img src="${plantUmlUrl}" alt="PlantUML Diagram">`;
      }
      // その他のコードブロックはデフォルトの表示
      return originalCodeRenderer.call(this, code, language);
    };

    marked.setOptions({
      renderer: renderer,
      gfm: true, // GitHub Flavored Markdownを有効化
      breaks: true, // 改行を<br>に変換
    });

    // 初期化
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    const ta = document.getElementById('md');
    const out = document.getElementById('out');

    async function renderPreview() {
      const markdownText = ta.value;
      out.innerHTML = marked.parse(markdownText);
      
      // Mermaidのレンダリングを実行
      try {
        await mermaid.run({
            nodes: out.querySelectorAll('.mermaid')
        });
      } catch (e) {
        console.error("Mermaid rendering error:", e);
      }
    }
    
    ta.oninput = renderPreview;

    // 初期表示用のサンプルテキスト
    ta.value = `# 高機能Markdownプレビュー

これは、**Marked.js**, **Mermaid.js**, **PlantUML** を組み合わせた高機能なMarkdownプレビューです。

## 主な機能

- **Markdown**: GFM(GitHub Flavored Markdown)に準拠
  - 箇条書き
  - 番号付きリスト
- **テーブル**
- **図の埋め込み**
  - Mermaid
  - PlantUML

---

### テーブルの例

| ヘッダー1 | ヘッダー2 | ヘッダー3 |
| :--- | :---: | ---: |
| 左寄せ | 中央寄せ | 右寄せ |
| cell | cell | cell |

### Mermaidの例 (フローチャート)

\`\`\`mermaid
graph TD;
    A[クリスマス] -->|プレゼント| B(私);
    B --> C{嬉しい？};
    C -->|Yes| D[笑顔];
    C -->|No| E[困惑];
\`\`\`

### PlantUMLの例 (シーケンス図)

\`\`\`plantuml
@startuml
actor ユーザー
participant ブラウザ
participant サーバー

ユーザー -> ブラウザ: テキスト入力
activate ブラウザ

ブラウザ -> サーバー: (PlantUMLコードを送信)
activate サーバー

サーバー --> ブラウザ: (UML画像)
deactivate サーバー

ブラウザ -> ユーザー: 画像表示
deactivate ブラウザ
@enduml
\`\`\`
`;

    // 初期プレビューを実行
    renderPreview();
  </script>
</body>
</html>
