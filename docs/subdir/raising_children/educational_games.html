<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知育遊び - Raising Children</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #fffaf0; }
        h1 { color: #f39c12; border-bottom: 2px solid #f39c12; padding-bottom: 10px; }
        .game-item { display: flex; align-items: flex-start; background: white; border: 1px solid #ffe0b2; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .game-icon { font-size: 2em; margin-right: 15px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 10px; text-decoration: none; color: #666; }
    </style>
</head>
<body>
    <!-- <div style="text-align:center;"><button onclick="history.back()" style="font-size:18px; padding:10px 20px;">BACK</button></div> -->
    <h1>★Educational Games</h1>
    <p>親子で楽しめる簡単な遊びのアイデアです。</p>

    <div class="game-item">
        <div class="game-icon">🙈</div>
        <div>
            <h3>いないいないばあ</h3>
            <p>0ヶ月から。顔が隠れて再び現れることで「物の永続性」を学びます。</p>
        </div>
    </div>

    <div class="game-item">
        <div class="game-icon">🧸</div>
        <div>
            <h3>感触遊び</h3>
            <p>4ヶ月頃から。布、シリコン、木など、異なる素材に触れて五感を刺激します。</p>
        </div>
    </div>

    <div class="game-item">
        <div class="game-icon">📦</div>
        <div>
            <h3>箱入れ遊び</h3>
            <p>10ヶ月頃から。空箱にボールや積み木を入れることで、距離感や形を認識します。</p>
        </div>
    </div>
    <div style="text-align:center;"><button onclick="history.back()" style="font-size:18px; padding:10px 20px;">BACK</button></div>
</body>
</html>
