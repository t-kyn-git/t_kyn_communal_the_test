    <h1>★Parenting Tips</h1>
    <p>毎日の育児が少し楽になるヒントです。</p>

    <div class="tip-box">
        <h3>規則正しいリズム作り</h3>
        <p>朝はカーテンを開けて日光を浴び、夜は暗く静かにすることで、赤ちゃんの体内時計を整えましょう。</p>
    </div>

    <div class="tip-box">
        <h3>スキンシップの大切さ</h3>
        <p>抱っこやベビーマッサージは、赤ちゃんの安心感だけでなく、親のストレス軽減にも繋がります。</p>
    </div>

    <div class="tip-box">
        <h3>「完璧」を目指さない</h3>
        <p>家事は後回しでも大丈夫。赤ちゃんが寝ている時は、あなたも一緒に休みましょう。</p>
