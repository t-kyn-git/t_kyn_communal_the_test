<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成長ロードマップ - Raising Children</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #fdfbfb; }
        h1 { color: #ffcadd; border-bottom: 2px solid #ffb6c1; padding-bottom: 10px; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .age-tag { background: #ffb6c1; color: white; padding: 2px 10px; border-radius: 20px; font-size: 0.9em; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 10px; text-decoration: none; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <nav><a href="../index.html">← 戻る</a></nav>
    <h1>★Child Growth Roadmaps</h1>
    <p>お子様の成長の目安をチェックしましょう。</p>

    <div class="card">
        <h3><span class="age-tag">0〜3ヶ月</span> ねんね期</h3>
        <ul>
            <li>手足をバタバタさせる</li>
            <li>あやすと笑う（社会的微笑）</li>
            <li>首がすわり始める</li>
        </ul>
    </div>

    <div class="card">
        <h3><span class="age-tag">4〜7ヶ月</span> 寝返り・お座り期</h3>
        <ul>
            <li>寝返りができる</li>
            <li>支えがあれば座れる</li>
            <li>離乳食がスタートする</li>
        </ul>
    </div>

    <div class="card">
        <h3><span class="age-tag">8〜11ヶ月</span> はいはい・つかまり立ち期</h3>
        <ul>
            <li>ずり這い、ハイハイができる</li>
            <li>つかまり立ち、つたい歩き</li>
            <li>指先で小さなものをつまめる</li>
        </ul>
    </div>
    <div style="text-align:center;"><button onclick="history.back()" style="font-size:18px; padding:10px 20px;">BACK</button></div>
</body>
</html>
