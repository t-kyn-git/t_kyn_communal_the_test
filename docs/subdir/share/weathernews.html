<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界の天気予報 (APIキー不要版)</title>
    <style>
        /* 全体のスタイル */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Noto Sans CJK JP', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2a3f54;
            margin-bottom: 30px;
        }

        /* 天気カードのコンテナ */
        #weather-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* 天気カードのデザイン */
        .weather-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            padding: 25px;
            width: 230px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .city-name {
            font-size: 1.6em;
            font-weight: 600;
            margin: 0 0 15px 0;
            color: #333;
        }

        .weather-icon {
            font-size: 4.5em; /* 絵文字のサイズ */
            line-height: 1;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 2.8em;
            font-weight: 700;
            margin: 5px 0;
            color: #1e88e5;
        }
        
        .weather-description {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #555;
            height: 2.2em; /* 2行分の高さを確保 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .details {
            font-size: 0.95em;
            color: #888;
        }
        
        .loading, .error {
            font-size: 1.2em;
            color: #777;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        footer {
            text-align: center; /* この一行がテキストを中央揃えにします */
            background: #f0f0f0;
            padding: 1rem;
            font-size: .9rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <h1>世界の天気予報</h1>
    <div id="weather-container">
        <!-- 天気情報はJavaScriptによってここに挿入されます -->
    </div>

    <script>
        // ページが読み込まれたら実行
        window.onload = function() {
            // 天気を表示したい都市のリスト（自由に追加・変更してください）
            // 都市名は英語で指定してください
            const cities = [
                'Tokyo',         // 東京
                'New York',      // ニューヨーク
                'London',        // ロンドン
                'Paris',         // パリ
                'Beijing',       // 北京
                'Seoul',         // ソウル
                'Sydney',        // シドニー
                'Rome',          // ローマ
                'Bangkok',       // バンコク
                'Los Angeles'    // ロサンゼルス
            ];

            const container = document.getElementById('weather-container');

            // 各都市の天気情報を取得して表示
            cities.forEach(city => {
                fetchWeatherData(city);
            });

            // 天気情報をAPIから取得する関数
            async function fetchWeatherData(city) {
                // ローディング表示用のカードを作成
                const placeholder = document.createElement('div');
                placeholder.className = 'weather-card';
                placeholder.innerHTML = `<div class="loading">「${city}」を読み込み中...</div>`;
                container.appendChild(placeholder);

                // wttr.in のJSONフォーマットを指定するURL
                const apiUrl = `https://wttr.in/${city}?format=j1`;

                try {
                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`データ取得に失敗`);
                    }
                    const data = await response.json();
                    
                    // ローディング表示を実際の天気情報カードに置き換え
                    displayWeather(data, placeholder, city);

                } catch (error) {
                    console.error('Error fetching weather data for ' + city + ':', error);
                    placeholder.innerHTML = `<div class="error">「${city}」<br>情報の取得に失敗しました。</div>`;
                }
            }

            // 取得した天気情報をHTMLに表示する関数
            function displayWeather(data, element, originalCityName) {
                // wttr.inは最も近い観測点を返すため、都市名が微妙に変わることがある
                // nearest_area[0].areaName[0].value を使うとより正確な地名になる
                const cityName = data.nearest_area[0].areaName[0].value;
                const weatherInfo = data.current_condition[0];
                
                const temperature = weatherInfo.temp_C;
                const weatherDescription = weatherInfo.lang_ja[0].value; // 日本語の天気情報
                const humidity = weatherInfo.humidity;
                const weatherCode = weatherInfo.weatherCode; // 天気コード

                const weatherIcon = getWeatherIcon(weatherCode);

                const cardHTML = `
                    <div class="city-name">${cityName}</div>
                    <div class="weather-icon">${weatherIcon}</div>
                    <div class="temperature">${temperature}°C</div>
                    <div class="weather-description">${weatherDescription}</div>
                    <div class="details">湿度: ${humidity}%</div>
                `;
                
                element.innerHTML = cardHTML;
            }

            // 天気コードに対応する絵文字を返す関数
            function getWeatherIcon(code) {
                const weatherCodes = {
                    '113': '☀️', // 晴れ
                    '116': '🌤️', // 所により曇り
                    '119': '☁️', // 曇り
                    '122': '☁️', // 曇り
                    '143': '🌫️', // 霧
                    '176': '🌦️', // にわか雨
                    '179': '🌨️', // にわか雪
                    '182': '🌨️', // 凍雨
                    '185': '🌨️', // 凍雨
                    '200': '⛈️', // 雷雨
                    '227': '🌨️', // 吹雪
                    '230': ' Blizzard',
                    '248': '🌫️', // 霧
                    '260': '🌫️', // 霧氷
                    '263': '🌦️', // 小雨
                    '266': '🌦️', // 小雨
                    '281': '🌨️', // 凍雨
                    '284': '🌨️', // 凍雨
                    '293': '🌦️', // 小雨
                    '296': '🌦️', // 小雨
                    '299': '🌧️', // 並の雨
                    '302': '🌧️', // 並の雨
                    '305': '🌧️', // 大雨
                    '308': '🌧️', // 大雨
                    '311': '🌨️', // 凍雨
                    '314': '🌨️', // 凍雨
                    '317': '🌨️', // みぞれ
                    '320': '🌨️', // みぞれ
                    '323': '🌨️', // 小雪
                    '326': '🌨️', // 小雪
                    '329': '❄️', // 雪
                    '332': '❄️', // 雪
                    '335': '❄️', // 大雪
                    '338': '❄️', // 大雪
                    '350': '🌨️', // みぞれ
                    '353': '🌦️', // 小雨
                    '356': '🌧️', // にわか雨
                    '359': '🌧️', // 大雨
                    '362': '🌨️', // みぞれ混じりの雨
                    '365': '🌨️', // みぞれ混じりの雨
                    '368': '🌨️', // 小雪
                    '371': '❄️', // 大雪
                    '374': '🌨️', // みぞれ
                    '377': '🌨️', // みぞれ
                    '386': '⛈️', // 雷雨
                    '389': '⛈️', // 雷を伴う大雪
                    '392': '⛈️', // 雷を伴う雪
                    '395': '❄️'  // 大雪
                };
                return weatherCodes[code] || '🌍'; // 不明な場合は地球の絵文字
            }
        };
    </script>

<div style="text-align:center;"><button onclick="history.back()" style="font-size:18px; padding:10px 20px;">BACK</button></div>
<footer>

</footer>
</body>
</html>
