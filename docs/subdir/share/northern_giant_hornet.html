### フェーズ1：【予防】巣を作らせない・寄せ付けないための先手必勝術

最も重要で効果的な対策は、スズメ-バチが巣を作りたくなる環境をなくし、そもそも寄せ付けないことです。

#### 1. 巣作りの初期段階を叩く！春先の女王蜂対策

#### 2. 自宅周りの徹底点検と環境整備

スズメバチは、雨風をしのげる閉鎖的な空間を好んで巣を作ります。

    *   **屋根裏、床下**: 換気口などから侵入し、巣を作ることがあります。
    *   **使っていない物置やエアコンの室外機の中**: 長期間放置されている場所は格好の営巣場所です。
    *   **庭木や生け垣の中**: 枝が密集している場所は発見が遅れがちです。
*   **予防策**:

### フェーズ2：【遭遇】もし出会ってしまったら…生還のための冷静な行動

もしスズメバチに遭遇してしまっても、パニックにならず冷静に行動することが最も重要です。

    *   **大声を出す**: ハチを興奮させます。
    *   **手で払う**: 攻撃されたとみなし、反撃してきます。
    *   **急に走り出す**: 逃げるものを追いかける習性があり、かえって危険です。
*   **正しい対処法**:
    *   **静かにその場を離れる**: 姿勢を低くしながら、ゆっくりと後ずさりして距離を取ります。
    *   **威嚇行動を察知する**: スズメバチが「カチカチ」という警戒音を出したり、まとわりつくように周りを飛び回ったりしたら、それは「これ以上近づくな」という最終警告です。速やかにその場を離れてください。
    *   **建物や車の中に避難する**: 近くに避難できる場所があれば、静かにそこへ逃げ込みましょう。

自宅の敷地内に巣を発見した場合、自分で駆除しようと考えるのは非常に危険です。

    *   巣の中には数百〜数千匹のハチが潜んでおり、巣に刺激を与えると一斉に襲ってきます。
    *   市販の殺虫剤では、全てのハチを駆除しきれず、生き残ったハチが凶暴化する恐れがあります。
    *   防護服なしでの作業は、刺されるリスクが極めて高く、命に関わります。
*   **取るべき行動**:
    *   **専門の駆除業者に依頼する**: 安全かつ確実に駆除するための最善の選択です。費用はかかりますが、命には代えられません。複数の業者から見積もりを取ることをお勧めします。

1.  **安全な場所へ避難**: まずは、その場からすぐに離れ、再び襲われない安全な場所に移動します。
2.  **毒を絞り出す**: 傷口を流水で洗いながら、指でつまんで毒液を絞り出します。 この時、口で吸い出すのは絶対にやめてください。口内に傷があるとそこから毒が入る危険があります。

4.  **患部を冷やす**: 濡れたタオルや氷嚢などで患部を冷やし、痛みと腫れを和らげます。
5.  **薬を塗る**: 抗ヒスタミン成分を含むステロイド軟膏などを塗布します。

#### 2. アナフィラキシーショックへの警戒と受診

最も恐ろしいのが、全身に及ぶアレルギー反応「アナフィラキシーショック」です。

*   **初期症状**:
    *   全身のじんましん、かゆみ、赤み

    *   息苦しさ、声のかすれ
    *   めまい、意識の混濁
*   **行動**: 上記のような症状が一つでも現れた場合は、**命の危険があるため、ためらわずに救急車を呼んでください**。
*   **受診を強く推奨するケース**:

    *   複数箇所を刺された場合。
    *   応急処置をしても症状が改善しない、または悪化する場合。
