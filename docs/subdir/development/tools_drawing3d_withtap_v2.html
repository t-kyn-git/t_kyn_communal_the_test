<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HTML 3Dブロックビルダー</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* スクロールバーを消す */
            font-family: sans-serif;
            background-color: #111;
        }
        canvas {
            display: block;
        }
        #toolbar {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .tool-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        label {
            font-size: 0.9em;
        }
        button {
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f9f9f9;
            cursor: pointer;
        }
        button.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 0.9em;
            pointer-events: none; /* 下の3D空間を操作できるようにする */
        }

        /* --- ここから追加したCSS --- */
        #mobile-controls {
            position: absolute;
            bottom: 40px;
            right: 10px;
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }
        #d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 120px;
            height: 120px;
        }
        #d-pad button {
            font-size: 1.5em;
            background-color: rgba(255, 255, 255, 0.7);
            border: 1px solid #aaa;
        }
        #d-pad-up { grid-area: 1 / 2 / 2 / 3; }
        #d-pad-left { grid-area: 2 / 1 / 3 / 2; }
        #d-pad-right { grid-area: 2 / 3 / 3 / 4; }
        #d-pad-down { grid-area: 3 / 2 / 4 / 3; }
        #d-pad-center { grid-area: 2 / 2 / 3 / 3; background: none; border: none; }

        #action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #action-buttons button {
            width: 60px;
            height: 40px;
            font-size: 0.8em;
            background-color: rgba(255, 255, 255, 0.7);
        }
        #action-place {
            background-color: rgba(40, 167, 69, 0.8);
            color: white;
            font-weight: bold;
            height: 60px;
        }
        /* --- ここまで追加したCSS --- */
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="tool-item">
            <label for="color-picker">色:</label>
            <input type="color" id="color-picker" value="#ffff00">
        </div>
        <div class="tool-item">
            <button id="add-button" class="active">置く</button>
            <button id="remove-button">消す</button>
        </div>
         <div class="tool-item">
            <button id="clear-button">全消し</button>
        </div>
    </div>

    <div id="instructions">
        ドラッグ: 視点回転 / 右ドラッグ(or 二本指): 平行移動 / スクロール(or ピンチ): 拡大・縮小
    </div>

    <!-- --- ここから追加したHTML --- -->
    <div id="mobile-controls">
        <div id="action-buttons">
            <button id="action-up">上へ</button>
            <button id="action-down">下へ</button>
        </div>
        <div id="d-pad">
            <button id="d-pad-up">↑</button>
            <button id="d-pad-left">←</button>
            <div id="d-pad-center"></div>
            <button id="d-pad-right">→</button>
            <button id="d-pad-down">↓</button>
        </div>
        <div id="action-buttons">
             <button id="action-place">決定</button>
        </div>
    </div>
    <!-- --- ここまで追加したHTML --- -->

    <!-- Three.js本体と視点操作用ライブラリをCDNから読み込む -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ここからJavaScript（3Dのロジック）
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 基本設定 ---
        let scene, camera, renderer, controls;
        let rollOverMesh, rollOverMaterial; // マウスカーソルに追従する半透明のブロック
        let objects = []; // 配置したブロックを管理する配列
        const planeSize = 20;

        let isRemoveMode = false;

        init();
        animate();

        function init() {
            // --- シーン（3D空間） ---
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7f9fbf);

            // --- カメラ ---
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(planeSize / 2, planeSize, planeSize * 1.5);
            camera.lookAt(0, 0, 0);

            // --- レンダラー（描画装置） ---
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // --- ライト（照明） ---
            const ambientLight = new THREE.AmbientLight(0x606060);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff);
            directionalLight.position.set(1, 0.75, 0.5).normalize();
            scene.add(directionalLight);

            // --- 地面グリッド ---
            const gridHelper = new THREE.GridHelper(planeSize, planeSize);
            scene.add(gridHelper);

            // --- ブロックを置くための透明な地面 ---
            const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
            planeGeo.rotateX(-Math.PI / 2);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            objects.push(plane); // 交差判定の対象に含める
            scene.add(plane);
            
            // --- ロールオーバー（マウスオーバー）用のメッシュ ---
            const rollOverGeo = new THREE.BoxGeometry(1, 1, 1);
            rollOverMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, opacity: 0.5, transparent: true });
            rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMaterial);
            scene.add(rollOverMesh);

            // --- 操作（OrbitControls） ---
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(planeSize / 4, 0, planeSize / 4); // カメラの中心を少しずらす
            controls.update();

            // --- イベントリスナー ---
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('resize', onWindowResize);
            
            // UIボタンのイベント
            const addButton = document.getElementById('add-button');
            const removeButton = document.getElementById('remove-button');
            const clearButton = document.getElementById('clear-button');

            addButton.addEventListener('click', () => {
                isRemoveMode = false;
                addButton.classList.add('active');
                removeButton.classList.remove('active');
                rollOverMesh.visible = true;
            });
            removeButton.addEventListener('click', () => {
                isRemoveMode = true;
                addButton.classList.remove('active');
                removeButton.classList.add('active');
                 rollOverMesh.visible = true;
            });
            clearButton.addEventListener('click', () => {
                if (confirm('本当にすべてのブロックを消しますか？')) {
                    // objects配列から地面(plane)以外を削除
                    for (let i = objects.length - 1; i > 0; i--) {
                        scene.remove(objects[i]);
                        objects.pop();
                    }
                }
            });

            // --- ここから追加したJavaScript ---
            // 十字キーとアクションボタンのイベントリスナー
            document.getElementById('d-pad-up').addEventListener('click', () => { rollOverMesh.position.z -= 1; });
            document.getElementById('d-pad-down').addEventListener('click', () => { rollOverMesh.position.z += 1; });
            document.getElementById('d-pad-left').addEventListener('click', () => { rollOverMesh.position.x -= 1; });
            document.getElementById('d-pad-right').addEventListener('click', () => { rollOverMesh.position.x += 1; });
            document.getElementById('action-up').addEventListener('click', () => { rollOverMesh.position.y += 1; });
            document.getElementById('action-down').addEventListener('click', () => { 
                if (rollOverMesh.position.y > 0.5) rollOverMesh.position.y -= 1; 
            });
            document.getElementById('action-place').addEventListener('click', placeOrRemoveVoxel);
            // --- ここまで追加したJavaScript ---
        }
        
        // --- ポインター（マウスやタッチ）の処理 ---
        const pointer = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();

        function updateRaycaster(event) {
            // UI上の操作は3D空間に影響させない
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.set(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );
            raycaster.setFromCamera(pointer, camera);
        }
        
        // 既存の関数を少し変更
        function onPointerMove(event) {
            updateRaycaster(event);
            const intersects = raycaster.intersectObjects(objects, false);
            if (intersects.length > 0) {
                const intersect = intersects[0];
                const newPos = new THREE.Vector3().copy(intersect.point).add(intersect.face.normal);
                // rollOverMeshの位置をスナップさせる
                rollOverMesh.position.set(Math.floor(newPos.x) + 0.5, Math.floor(newPos.y) + 0.5, Math.floor(newPos.z) + 0.5);
                rollOverMesh.visible = true;
            } else {
                rollOverMesh.visible = false;
            }
        }
        
        // 既存の関数を少し変更
        function onPointerDown(event) {
            // event.targetがcanvasでない（UI要素である）場合は処理を中断
            if (event.target !== renderer.domElement) return;

            updateRaycaster(event);
            const intersects = raycaster.intersectObjects(objects, false);

            if (intersects.length > 0) {
                // 指でタップした場合は、その場所に直接ブロックを置く/消す
                const intersect = intersects[0];
                 if (isRemoveMode) {
                    if (intersect.object !== objects[0]) { // 地面は消さない
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                    }
                } else {
                    const newPos = new THREE.Vector3().copy(intersect.point).add(intersect.face.normal);
                    const newPosition = new THREE.Vector3(
                        Math.floor(newPos.x) + 0.5, 
                        Math.floor(newPos.y) + 0.5, 
                        Math.floor(newPos.z) + 0.5
                    );
                    placeVoxel(newPosition);
                }
            }
        }
        
        // --- ここから追加したJavaScript関数 ---
        // ブロックを置く/消す処理を関数化
        function placeOrRemoveVoxel() {
             if (isRemoveMode) {
                // 消すモード: rollOverMeshの位置にあるブロックを探して消す
                const positionToRemove = rollOverMesh.position;
                const objectToRemove = objects.find(obj => obj.position.equals(positionToRemove));
                if (objectToRemove && objectToRemove !== objects[0]) { // 地面は消さない
                    scene.remove(objectToRemove);
                    objects.splice(objects.indexOf(objectToRemove), 1);
                }
            } else {
                // 置くモード: rollOverMeshの位置にブロックを置く
                placeVoxel(rollOverMesh.position);
            }
        }

        // ブロックを特定の位置に置く関数
        function placeVoxel(position) {
            const color = document.getElementById('color-picker').value;
            const voxelGeo = new THREE.BoxGeometry(1, 1, 1);
            const voxelMat = new THREE.MeshLambertMaterial({ color: parseInt(color.replace('#','0x')) });
            const voxel = new THREE.Mesh(voxelGeo, voxelMat);

            voxel.position.copy(position);
            
            scene.add(voxel);
            objects.push(voxel);
        }
        // --- ここまで追加したJavaScript関数 ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // カメラコントロールを更新
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>```
