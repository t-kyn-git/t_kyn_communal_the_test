<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HTML 3Dブロックビルダー(Version 3)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #111;
    }
    canvas { display: block; }
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px;
      background-color: rgba(255,255,255,0.8);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .tool-item { display: flex; align-items: center; gap: 5px; }
    label { font-size: 0.9em; }
    button {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f9f9f9;
      cursor: pointer;
    }
    button.active {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    }
    #instructions {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 0.9em;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <div class="tool-item">
      <label for="color-picker">色:</label>
      <input type="color" id="color-picker" value="#ffff00">
    </div>
    <div class="tool-item">
      <button id="add-button" class="active">置く</button>
      <button id="remove-button">消す</button>
      <button id="clear-button">全消し</button>
    </div>
    <!-- ★ エクスポート／インポートボタン追加 -->
    <div class="tool-item">
      <button id="export-button">エクスポート</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
      <button id="import-button">インポート</button>
    </div>
  </div>

  <div id="instructions">
    ドラッグ: 視点回転 / 右ドラッグ(or 二本指): 平行移動 / スクロール(or ピンチ): 拡大・縮小
  </div>

  <!-- Three.js -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    let scene, camera, renderer, controls;
    let rollOverMesh, rollOverMaterial;
    let objects = []; // 0番目は plane
    const planeSize = 20;
    let isRemoveMode = false;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7f9fbf);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(planeSize/2, planeSize, planeSize*1.5);
      camera.lookAt(0,0,0);

      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0x606060);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff);
      directionalLight.position.set(1,0.75,0.5).normalize();
      scene.add(directionalLight);

      const gridHelper = new THREE.GridHelper(planeSize, planeSize);
      scene.add(gridHelper);

      const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
      planeGeo.rotateX(-Math.PI/2);
      const planeMat = new THREE.MeshBasicMaterial({visible:false});
      const plane = new THREE.Mesh(planeGeo, planeMat);
      objects.push(plane);
      scene.add(plane);

      const rollOverGeo = new THREE.BoxGeometry(1,1,1);
      rollOverMaterial = new THREE.MeshBasicMaterial({color:0xff0000,opacity:0.5,transparent:true});
      rollOverMesh = new THREE.Mesh(rollOverGeo, rollOverMaterial);
      scene.add(rollOverMesh);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(planeSize/4, 0, planeSize/4);
      controls.update();

      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('resize', onWindowResize);

      // UI
      document.getElementById('add-button').addEventListener('click', () => {
        isRemoveMode=false;
        setActive('add');
      });
      document.getElementById('remove-button').addEventListener('click', () => {
        isRemoveMode=true;
        setActive('remove');
      });
      document.getElementById('clear-button').addEventListener('click', clearBlocks);

      // ★ エクスポート／インポート
      document.getElementById('export-button').addEventListener('click', exportJSON);
      document.getElementById('import-button').addEventListener('click', () => {
        document.getElementById('import-file').click();
      });
      document.getElementById('import-file').addEventListener('change', importJSON);
    }

    function setActive(mode){
      document.getElementById('add-button').classList.toggle('active', mode==='add');
      document.getElementById('remove-button').classList.toggle('active', mode==='remove');
      rollOverMesh.visible=true;
    }

    function clearBlocks(){
      if(confirm('本当にすべてのブロックを消しますか？')){
        for(let i=objects.length-1;i>0;i--){
          scene.remove(objects[i]);
          objects.pop();
        }
      }
    }

    const pointer = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    function updateRaycaster(event){
      pointer.set((event.clientX/window.innerWidth)*2-1, -(event.clientY/window.innerHeight)*2+1);
      raycaster.setFromCamera(pointer, camera);
    }

    function onPointerMove(event){
      updateRaycaster(event);
      const intersects = raycaster.intersectObjects(objects,false);
      if(intersects.length>0){
        const intersect = intersects[0];
        const newPos = new THREE.Vector3().copy(intersect.point).add(intersect.face.normal);
        rollOverMesh.position.set(Math.floor(newPos.x)+0.5, Math.floor(newPos.y)+0.5, Math.floor(newPos.z)+0.5);
        rollOverMesh.visible=true;
      } else {
        rollOverMesh.visible=false;
      }
    }

    function onPointerDown(event){
      updateRaycaster(event);
      const intersects = raycaster.intersectObjects(objects,false);
      if(intersects.length>0){
        const intersect = intersects[0];
        if(isRemoveMode){
          if(intersect.object!==objects[0]){
            scene.remove(intersect.object);
            objects.splice(objects.indexOf(intersect.object),1);
          }
        } else {
          const color = document.getElementById('color-picker').value;
          const voxelGeo = new THREE.BoxGeometry(1,1,1);
          const voxelMat = new THREE.MeshLambertMaterial({color: parseInt(color.replace('#','0x'))});
          const voxel = new THREE.Mesh(voxelGeo, voxelMat);
          const newPos = new THREE.Vector3().copy(intersect.point).add(intersect.face.normal);
          voxel.position.set(Math.floor(newPos.x)+0.5, Math.floor(newPos.y)+0.5, Math.floor(newPos.z)+0.5);
          scene.add(voxel);
          objects.push(voxel);
        }
      }
    }

    function onWindowResize(){
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene,camera);
    }

    // === JSON Export/Import ===
    function exportJSON(){
      const data = objects.slice(1).map(obj => ({
        x: obj.position.x,
        y: obj.position.y,
        z: obj.position.z,
        color: obj.material.color.getHex()
      }));
      const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url;
      a.download='blocks.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event){
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try{
          const data = JSON.parse(e.target.result);
          clearBlocks();
          data.forEach(item=>{
            const voxelGeo = new THREE.BoxGeometry(1,1,1);
            const voxelMat = new THREE.MeshLambertMaterial({color:item.color});
            const voxel = new THREE.Mesh(voxelGeo, voxelMat);
            voxel.position.set(item.x,item.y,item.z);
            scene.add(voxel);
            objects.push(voxel);
          });
        }catch(err){
          alert('JSON読み込み失敗: '+err);
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
