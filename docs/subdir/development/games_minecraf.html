<!DOCTYPE html>
<html lang="ja">
<head>
    <title>HTML Minecraft</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Monospace;
            font-size: 13px;
            line-height: 24px;
            overscroll-behavior: none;
        }
        canvas { display: block; }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        #instructions {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            pointer-events: none; /* カーソルロック時にクリックイベントを妨げないように */
        }
    </style>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <p style="font-size: 36px">クリックしてプレイ</p>
            <p>
                移動: W, A, S, D<br/>
                ジャンプ: SPACE<br/>
                ブロックを壊す: 左クリック<br/>
                ブロックを置く: 右クリック<br/>
                カーソルロック解除: ESC
            </p>
        </div>
    </div>
    <div class="crosshair"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        //============= Three.js と PointerLockControls, Perlin/Simplex Noise はimportmap経由で読み込みます =============
        // HTML単一ファイルで完結させるため、現代的なアプローチである importmap を使用します。
        // これにより、ライブラリのコードを直接ファイルに埋め込む必要がなくなり、コードが読みやすくなります。
        // このファイルはインターネット接続がなくても、一度ブラウザがライブラリをキャッシュすれば動作します。
        
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { createNoise2D } from 'https://cdn.skypack.dev/simplex-noise';

        let camera, scene, renderer, controls;
        const objects = [];
        let raycaster;

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;

        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        
        const worldWidth = 50, worldDepth = 50;
        const waterLevel = 8;
        const textureLoader = new THREE.TextureLoader();

        // テクスチャの定義
        const dirtTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAApklEQVQ4y2P4//8/AyUYwQIYGBgYWIZgAR40YpDBsps3b/7//z9DqGz//v0/A8P///8ZmBgaGAo5GBgY2SAjAy4G5s/f/z9///79/8+fP/+vXr3637dv3wgsIsrAysrK/9+9e/c/RkZGfhkZGf8LCgr6L6CgoP+ampr/8+fP/++fP//fv3//gY2Njf8ZGRn/uXPn/v/58+f/9+vXDyIYGFivX7/+P378+P/58+f/FyxY8F+yZMn/Bxct+n/p0qX/f/369X+mTJn+P3v27P9BQUE/AwODgQEpiA0AAGz129yKz/YRAAAAAElFTkSuQmCC');
        const grassTopTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAxElEQVQ4y2P4//8/A1UYwQJgAIP/df9A/P79+z8D0f//v38wYGBgYFj8//9/BkbG/4AGQPDv37//v3r16n+mTJn+P3jw4P+jR4/+P3jw4P+///8/AwPj/wADwPXr199///79/9+9e/c/f/78/3///v0/ISEh/4uLi/+JiYn/SUlJ/0tLS/+vr6//j4+P/3Jycv/v37//x8TE/ENDQ/+7d+//z58//79//vzz589/sLCw/zs7O//v37//379//xmsmJkBAFjTz00j2aBFAAAAAElFTkSuQmCC');
        const grassSideTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAqElEQVQ4y2P4//8/A1UYwQJgAIP/df9A/P79+z8D0f//v38wYGBgYFj8//9/BkbG/4AGQPDv37//v3r16n+mTJn+P3jw4P+jR4/+P3jw4P+///8/AwPj/wADwPXr199///79/9+9e/c/f/78/yYGBgb+ExIS/mhoaP6ZmZn/RkZG/u/fv/9HRkb+z8/P/5+fn/+fn5//z8/P/8/Pz//Pz8//r1+//j9//vz/BQYG/v/9+w8jYIsBAAmX0U/g2g/RAAAAAElFTkSuQmCC');
        const woodTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAmUlEQVQ4y2P4//8/A1UYwQJgAIP/df9A/P79+z8D0f//v38wYGBgYFj8//9/BkbG/4AGQPDv37//v3r16n+mTJn+P3jw4P+jR4/+P3jw4P+///8/A8P///8ZGBgY/j9//vz/xYsX/xcuXPhfuHDh/8yZM//Fixf/Z86c+X/69Ok/MjIy/iUlJf+EhIT/DAwMjIAsBQDZ53FPJc2XCAAAAABJRU5ErkJggg==');
        const leafTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAApElEQVQ4y+2T0QnAIAxF3/VcyBGczCGO4iSO4gRO4hhN8h8t0lQCS8h/3xfeF6k14RzHCmBEApsCKEHcI4rM6mJkE4AnY5E5TQA6Bzz2vQUAM1l55xUATgEcy7r3fA9Avifg/d8DkC8B4HyvB4D/T4C9pwE41w0A/w6Axx0D4HcPAN77GgB9ywBgv1cAuPUdAF57BgBf9/8fAMwPpgPbDxvQAAAAAElFTkSuQmCC');
        const waterTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAhklEQVQ4y2NgoBAwMjAwMDAw+M/AwAAEZfj/n5GRgRmIgvj//z8DPYgA5Pz/DwPZgIghyMDAwDDf//18wQ24//8/AxMDAwPDAsQ/Qy+TAQMDAwODyYGBgYEBx4E/MAwU5dEBLhQGBgYGBpajgGgABsOAzYGBgYHBjAEANt45/glsI5YAAAAASUVORK5CYII=');

        [dirtTexture, grassTopTexture, grassSideTexture, woodTexture, leafTexture, waterTexture].forEach(t => {
            t.magFilter = THREE.NearestFilter;
            t.minFilter = THREE.NearestFilter;
        });

        const grassMaterial = [
            new THREE.MeshLambertMaterial({ map: grassSideTexture }),
            new THREE.MeshLambertMaterial({ map: grassSideTexture }),
            new THREE.MeshLambertMaterial({ map: grassTopTexture }),
            new THREE.MeshLambertMaterial({ map: dirtTexture }),
            new THREE.MeshLambertMaterial({ map: grassSideTexture }),
            new THREE.MeshLambertMaterial({ map: grassSideTexture }),
        ];
        const dirtMaterial = new THREE.MeshLambertMaterial({ map: dirtTexture });
        const woodMaterial = new THREE.MeshLambertMaterial({ map: woodTexture });
        const leafMaterial = new THREE.MeshLambertMaterial({ map: leafTexture, transparent: true, side: THREE.DoubleSide });
        const waterMaterial = new THREE.MeshLambertMaterial({ map: waterTexture, transparent: true, opacity: 0.6 });
        
        const materials = {
            'grass': grassMaterial,
            'dirt': dirtMaterial,
            'wood': woodMaterial,
            'leaf': leafMaterial,
            'water': waterMaterial
        };

        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
        
        init();
        animate();

        function init() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 20;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 0, 100);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xcccccc);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 200, 100);
            scene.add(directionalLight);

            // Controls
            controls = new PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                blocker.style.display = 'block';
                instructions.style.display = '';
            });

            scene.add(controls.getObject());
            
            // World Generation
            generateWorld();

            raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
        }

        function generateWorld() {
            const noise = createNoise2D();
            for (let x = -worldWidth / 2; x < worldWidth / 2; x++) {
                for (let z = -worldDepth / 2; z < worldDepth / 2; z++) {
                    const y = Math.round(noise(x / 20, z / 20) * 10) + 10;
                    
                    // Base ground
                    addVoxel(x, y, z, 'grass');
                    addVoxel(x, y-1, z, 'dirt');
                    for (let h = y - 2; h > 0; h--) {
                       addVoxel(x, h, z, 'dirt');
                    }
                    
                    // Water
                    for (let h = 1; h < waterLevel; h++) {
                        if (!voxelExists(x,h,z)) {
                            addVoxel(x, h, z, 'water');
                        }
                    }

                    // Trees
                    if (y >= waterLevel && Math.random() < 0.05) {
                        generateTree(x, y + 1, z);
                    }
                }
            }
        }
        
        function generateTree(x, y, z) {
            const height = Math.floor(Math.random() * 3) + 4;
            // Trunk
            for(let i = 0; i < height; i++) {
                addVoxel(x, y + i, z, 'wood');
            }
            // Leaves
            const radius = 2;
            for(let ly = y + height - 2; ly < y + height + 2; ly++) {
                for(let lx = x - radius; lx <= x + radius; lx++) {
                    for(let lz = z - radius; lz <= z + radius; lz++) {
                        const d = Math.sqrt((lx-x)*(lx-x) + (lz-z)*(lz-z));
                        if (d <= radius && Math.random() > 0.5) {
                            if(!voxelExists(lx, ly, lz)){
                                addVoxel(lx, ly, lz, 'leaf');
                            }
                        }
                    }
                }
            }
        }

        function voxelExists(x, y, z) {
            return objects.some(obj => obj.position.equals(new THREE.Vector3(x,y,z)));
        }

        function addVoxel(x, y, z, type) {
            const material = materials[type];
            if (!material) return;

            const voxel = new THREE.Mesh(boxGeometry, material);
            voxel.position.set(x, y, z);
            voxel.name = type; // Store type for potential future use
            scene.add(voxel);
            objects.push(voxel);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = true; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = true; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = true; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump === true) velocity.y += 10; canJump = false; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveForward = false; break;
                case 'ArrowLeft':
                case 'KeyA': moveLeft = false; break;
                case 'ArrowDown':
                case 'KeyS': moveBackward = false; break;
                case 'ArrowRight':
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseDown(event) {
            if (!controls.isLocked) return;
            
            // This requires a bit more setup with raycasting from the center of the screen
            const mouse = new THREE.Vector2(0, 0); // Center of the screen
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (event.button === 0) { // Left click: remove block
                    if (intersect.object.name !== 'water') { // Can't break water
                        scene.remove(intersect.object);
                        objects.splice(objects.indexOf(intersect.object), 1);
                    }
                } else if (event.button === 2) { // Right click: add block
                    const newPos = intersect.object.position.clone().add(intersect.face.normal);
                    addVoxel(newPos.x, newPos.y, newPos.z, 'dirt');
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - (window.prevTime || 0)) / 1000;

            if (controls.isLocked === true) {
                raycaster.ray.origin.copy(controls.getObject().position);
                raycaster.ray.origin.y -= 1; // Start ray from player's feet
                
                const intersections = raycaster.intersectObjects(objects);
                const onObject = intersections.length > 0;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 5.0 * delta; // gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // this ensures consistent movements in all directions

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                if (onObject === true) {
                    velocity.y = Math.max(0, velocity.y);
                    canJump = true;
                }

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < -20) { // Fall out of world reset
                    velocity.y = 0;
                    controls.getObject().position.set(0, 25, 0);
                }
            }
            window.prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
