### JavaScript 主要リファレンス一覧

#### 1. 基本的な構文と宣言

*   **`let`**: 再代入が可能な変数を宣言します。ブロックスコープを持ちます。
*   **`const`**: 再代入が不可能な定数を宣言します。ブロックスコープを持ちます。
*   **データ型**:
    *   `String`: 文字列
    *   `Number`: 数値
    *   `Boolean`: `true` (真) または `false` (偽)
    *   `null`: 値が存在しないことを意図的に示す値
    *   `undefined`: 値が未定義の状態
    *   `Object`: オブジェクト (複数の値をまとめたもの)
    *   `Array`: 配列 (順序付けられたリスト)
*   **演算子**:
    *   **算術演算子**: `+`, `-`, `*`, `/`, `%` (剰余), `++` (インクリメント), `--` (デクリメント)
    *   **比較演算子**: `==` (等しい), `===` (厳密に等しい), `!=`, `!==`, `>`, `<`, `>=`, `<=`
    *   **論理演算子**: `&&` (AND), `||` (OR), `!` (NOT)
    *   **代入演算子**: `=`, `+=`, `-=`

#### 2. 制御フロー

*   **`if...else`**: 条件によって処理を分岐させます。
*   **`switch`**: 一つの式の値に基づいて、複数のケースから処理を分岐させます。
*   **`for`**: 指定した回数だけ処理を繰り返します。
*   **`while`**: 指定した条件が真である間、処理を繰り返します。
*   **`try...catch`**: エラーが発生する可能性のある処理を試行し、エラーを捕捉して対応します。

#### 3. 関数

*   **`function`**: 処理をまとめたブロック（関数）を定義します。
*   **アロー関数 (`=>`)**: `function`キーワードよりも短く記述できる関数構文です。
*   **引数**: 関数に渡す値です。
*   **`return`**: 関数の実行結果として値を返します。

#### 4. 組み込みオブジェクト

##### **String (文字列)**
*   **`.length`**: 文字列の長さを取得します。
*   **`.slice(beginIndex, endIndex)`**: 文字列の一部を切り出して新しい文字列を返します。
*   **`.split(separator)`**: 文字列を指定した区切り文字で分割し、配列にします。
*   **`.replace(searchValue, newValue)`**: 文字列の一部を検索し、置き換えます。
*   **`.toLowerCase()` / `.toUpperCase()`**: 文字列を小文字または大文字に変換します。

##### **Array (配列)**
*   **`.length`**: 配列の要素数を取得します。
*   **`.push(element)`**: 配列の末尾に要素を追加します。
*   **`.pop()`**: 配列の末尾の要素を削除して返します。
*   **`.forEach(callback)`**: 各要素に対して一度ずつ関数を実行します。
*   **`.map(callback)`**: 各要素に関数を実行し、その結果からなる新しい配列を作成します。
*   **`.filter(callback)`**: 関数が `true` を返した要素だけで構成される新しい配列を作成します。
*   **`.find(callback)`**: 条件に一致する最初の要素を返します。
*   **`.join(separator)`**: 配列の全要素を連結した一つの文字列を返します。

##### **Math**
*   **`Math.random()`**: 0以上1未満のランダムな数値を返します。
*   **`Math.floor(x)`**: 数値の小数点以下を切り捨てます。
*   **`Math.ceil(x)`**: 数値の小数点以下を切り上げます。
*   **`Math.round(x)`**: 数値を四捨五入します。
*   **`Math.max(...)` / `Math.min(...)`**: 引数の中から最大値または最小値を返します。

##### **Date**
*   **`new Date()`**: 現在の日付と時刻でDateオブジェクトを生成します。
*   **`.getFullYear()`**: 年を取得します。
*   **`.getMonth()`**: 月を取得します (0-11で返されるので注意)。
*   **`.getDate()`**: 日を取得します。
*   **`.getHours()` / `.getMinutes()` / `.getSeconds()`**: 時、分、秒を取得します。

##### **JSON**
*   **`JSON.stringify(object)`**: JavaScriptオブジェクトをJSON形式の文字列に変換します。
*   **`JSON.parse(string)`**: JSON形式の文字列をJavaScriptオブジェクトに変換します。

#### 5. DOM (Document Object Model) - HTMLの操作

*   **`document.getElementById(id)`**: 指定したIDを持つ要素を取得します。
*   **`document.querySelector(selector)`**: 指定したCSSセレクタに一致する最初の要素を取得します。
*   **`document.querySelectorAll(selector)`**: 指定したCSSセレクタに一致するすべての要素をリストで取得します。
*   **`element.innerHTML`**: 要素内のHTMLを取得または設定します。
*   **`element.textContent`**: 要素内のテキストコンテンツを取得または設定します。
*   **`element.style.property`**: 要素のCSSスタイルを変更します (例: `element.style.color = 'red';`)。
*   **`element.classList.add('class')` / `.remove('class')` / `.toggle('class')`**: 要素のCSSクラスを追加、削除、または切り替えます。
*   **`document.createElement(tagName)`**: 新しいHTML要素を作成します。
*   **`parentNode.appendChild(childNode)`**: 指定した親要素の末尾に子要素を追加します。

#### 6. イベント

*   **`element.addEventListener('event', function)`**: 要素にイベントが発生したときに実行される関数を登録します。
*   **代表的なイベント**:
    *   `click`: クリックされたとき。
    *   `mouseover`: マウスカーソルが要素の上に乗ったとき。
    *   `keydown`: キーボードのキーが押されたとき。
    *   `submit`: フォームが送信されたとき。
    *   `load`: ページ全体の読み込みが完了したとき。
    *   `DOMContentLoaded`: HTMLの解析が完了したとき（画像などの読み込みより早い）。

#### 7. BOM (Browser Object Model) - ブラウザの操作

*   **`window`**: ブラウザのウィンドウ全体を表すグローバルオブジェクト。
*   **`alert(message)`**: 警告ダイアログを表示します。
*   **`confirm(message)`**: 確認ダイアログを表示し、OK/キャンセルの結果を `true`/`false` で返します。
*   **`console.log(data)`**: 開発者ツールのコンソールに情報を出力します。
*   **`setTimeout(function, milliseconds)`**: 指定した時間後に一度だけ関数を実行します。
*   **`setInterval(function, milliseconds)`**: 指定した時間ごとに関数を繰り返し実行します。
*   **`location.href`**: 現在のページのURLを取得、または新しいURLに移動します。

#### 8. 非同期処理

*   **`Promise`**: 非同期処理の最終的な完了または失敗を表すオブジェクトです。
*   **`async` / `await`**: Promiseをより同期的なコードのように扱うための構文です。
*   **`fetch(url)`**: ネットワークリクエストを行い、リソースを取得するためのAPIです。Promiseを返します。

### JavaScript 詳細リファレンス一覧 (応用編)

#### 8. オブジェクトとクラス (オブジェクト指向)

オブジェクトの作り方や設計図となる「クラス」に関する機能です。

*   **オブジェクトリテラル**: `{}` を使ってオブジェクトを直感的に作成する方法です。
    *   **説明**: `キー: 値` のペアでプロパティ（データ）やメソッド（処理）を定義します。
    *   **例**:
        ```javascript
        const user = {
          name: "田中",
          age: 30,
          greet: function() {
            console.log(`こんにちは、${this.name}です。`);
          }
        };
        user.greet(); // "こんにちは、田中です。" と出力
        ```

*   **`this`**: 関数がどのように呼び出されたかによって決まる、特別なキーワードです。
    *   **説明**: メソッド内では、そのメソッドが属するオブジェクト自身を指します。グローバルな場所や通常の関数内では `window` オブジェクトを指すことが多いですが、状況により異なります。
    *   **例**: 上記の `user.greet()` 内の `this.name` は `user.name` と同じ意味になります。

*   **`class`**: オブジェクトの設計図（テンプレート）を定義するための構文です。
    *   **説明**: 同じ構造を持つオブジェクトを効率的に複数作成できます。
    *   **例**:
        ```javascript
        class Animal {
          constructor(name) {
            this.name = name;
          }
          speak() {
            console.log(`${this.name}が鳴いています。`);
          }
        }
        const dog = new Animal("ポチ");
        dog.speak(); // "ポチが鳴いています。" と出力
        ```

*   **`constructor`**: `class`でオブジェクトを生成する (`new`) ときに、最初に一度だけ実行される初期化用のメソッドです。
    *   **説明**: 主にプロパティの初期値を設定するために使います。

*   **`extends`**: あるクラスの機能を継承して、新しいクラスを作成します。
    *   **説明**: コードの再利用性を高めます。継承元のクラスを「親クラス」、新しいクラスを「子クラス」と呼びます。
    *   **例**:
        ```javascript
        class Cat extends Animal {
          speak() {
            console.log(`${this.name}はニャーと鳴きます。`);
          }
        }
        const cat = new Cat("タマ");
        cat.speak(); // "タマはニャーと鳴きます。" と出力
        ```

#### 9. モダンJavaScriptの便利な構文 (ES6+)

コードをより簡潔で直感的に書くための構文です。

*   **分割代入**: 配列やオブジェクトから値を取り出して、個別の変数に代入する構文です。
    *   **説明**: コードの記述量を減らし、可読性を向上させます。
    *   **例**:
        ```javascript
        // 配列の分割代入
        const [a, b] = [10, 20]; // aは10, bは20
        
        // オブジェクトの分割代入
        const { name, age } = { name: "鈴木", age: 25 }; // nameは"鈴木", ageは25
        ```

*   **スプレッド構文 (`...`)**: 配列やオブジェクトの要素をその場で展開します。
    *   **説明**: 配列の結合やオブジェクトのマージ、関数の引数に配列の要素を渡す際などに便利です。
    *   **例**:
        ```javascript
        const arr1 = [1, 2];
        const arr2 = [...arr1, 3, 4]; // [1, 2, 3, 4] になる
        
        const obj1 = { a: 1 };
        const obj2 = { ...obj1, b: 2 }; // { a: 1, b: 2 } になる
        ```

*   **レスト構文 (`...`)** (残余引数): 関数の引数などで、残りの要素をまとめて配列として受け取ります。
    *   **説明**: 見た目はスプレッド構文と同じですが、代入の左辺や関数の引数で使われると、要素を集める役割を果たします。
    *   **例**:
        ```javascript
        function sum(...numbers) {
          return numbers.reduce((total, num) => total + num, 0);
        }
        sum(1, 2, 3, 4); // 10 が返る
        ```

*   **テンプレートリテラル**: バッククォート (`` ` ``) を使って文字列を定義します。
    *   **説明**: 文字列内に `${変数名}` の形で簡単に変数を埋め込めます。改行もそのまま反映されます。
    *   **例**:
        ```javascript
        const userName = "佐藤";
        const message = `ようこそ、${userName}さん。
        今日も頑張りましょう。`;
        ```

#### 10. モジュールシステム (ES6 Modules)

JavaScriptのコードをファイル単位に分割し、必要なものだけを読み込んで利用する仕組みです。

*   **`export`**: 変数、関数、クラスなどを他のファイルから読み込めるように公開します。
    *   **説明**: `export`（名前付きエクスポート）と `export default`（デフォルトエクスポート）の2種類があります。
    *   **例** (`utils.js` ファイル):
        ```javascript
        export const PI = 3.14;
        export default function greet(name) {
          return `Hello, ${name}`;
        }
        ```

*   **`import`**: `export`された変数や関数などを別のファイルで読み込みます。
    *   **説明**: コードの依存関係が明確になり、管理しやすくなります。
    *   **例** (`main.js` ファイル):
        ```javascript
        import greet, { PI } from './utils.js';
        
        console.log(PI); // 3.14
        console.log(greet("World")); // "Hello, World"
        ```

#### 11. 高度な配列メソッド

基本的な `forEach` や `map` に加えて、より複雑なデータ操作を行うためのメソッドです。

*   **`.reduce(callback, initialValue)`**: 配列の各要素を順番に処理し、一つの結果（累積値）を返します。
    *   **説明**: 合計値の計算、要素の集計、オブジェクトの再構成など、非常に強力で応用範囲が広いです。
    *   **例** (合計値を計算):
        ```javascript
        const numbers =;
        const total = numbers.reduce((accumulator, currentValue) => accumulator + currentValue, 0);
        // total は 15
        ```

*   **`.some(callback)`**: 配列の要素のうち、一つでもコールバック関数が `true` を返せば、全体の結果として `true` を返します。
    *   **例**:
        ```javascript
        const hasEvenNumber =.some(num => num % 2 === 0); // true
        ```

*   **`.every(callback)`**: 配列のすべての要素がコールバック関数で `true` を返した場合にのみ、全体の結果として `true` を返します。
    *   **例**:
        ```javascript
        const allEvenNumbers =.every(num => num % 2 === 0); // true
        ```

#### 12. Web API (ブラウザ機能の利用)

ブラウザが提供する便利な機能を利用するためのインターフェースです。

*   **`localStorage`**: ユーザーのブラウザにデータを永続的に保存します。
    *   **説明**: 文字列データのみ保存可能。ブラウザを閉じてもデータは消えません。
    *   **例**:
        ```javascript
        // データを保存
        localStorage.setItem('username', 'Taro');
        // データを取得
        const username = localStorage.getItem('username');
        // データを削除
        localStorage.removeItem('username');
        ```

*   **`sessionStorage`**: `localStorage`と似ていますが、データはブラウザのタブを閉じるまでしか保持されません。
    *   **説明**: 一時的な情報の保存に利用します。APIは`localStorage`と同じです。
