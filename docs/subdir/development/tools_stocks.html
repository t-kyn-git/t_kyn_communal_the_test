<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIキー不要の株価表示ツール (TradingView Widget)</title>
    <!-- シンプルで見やすいCSSフレームワーク (Pico.css) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <style>
        body {
            padding: 2rem;
        }
        .tradingview-widget-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <main class="container">
        <header>
            <h1>APIキー不要の株価表示ツール</h1>
            <p>
                TradingViewのウィジェットを利用して、現在の株価と高機能チャートを表示します。<br>
                このHTMLファイルを編集して、<code>symbol</code>の値を変更することで他の銘柄も表示できます。
            </p>
        </header>

        <!-- =================================================================================== -->
        <!-- 1. シンボル情報ウィジェット：現在の株価などをコンパクトに表示 -->
        <!-- =================================================================================== -->
        <article>
            <header><strong>現在の株価情報</strong></header>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js" async>
                {
                  "symbol": "NASDAQ:AAPL", // ← 表示したい銘柄をここで変更 (例: "TSE:7203" トヨタ自動車)
                  "width": "100%",
                  "locale": "ja",
                  "colorTheme": "light",
                  "isTransparent": false
                }
                </script>
            </div>
        </article>

        <!-- =================================================================================== -->
        <!-- 2. 高機能チャートウィジェット：詳細なテクニカル分析が可能 -->
        <!-- =================================================================================== -->
        <article>
             <header><strong>テクニカル分析チャート</strong></header>
            <div class="tradingview-widget-container" style="height: 600px;">
                <div id="tradingview_chart"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget(
                {
                  "autosize": true,
                  "symbol": "NASDAQ:AAPL", // ← 表示したい銘柄をここで変更 (例: "TSE:9984" ソフトバンクグループ)
                  "interval": "D", // D=日足, W=週足, M=月足
                  "timezone": "Asia/Tokyo",
                  "theme": "light",
                  "style": "1", // 1=バー, 2=ローソク, 3=ライン
                  "locale": "ja",
                  "toolbar_bg": "#f1f3f6",
                  "enable_publishing": false,
                  "allow_symbol_change": true, // チャート上で銘柄検索を許可するか
                  "studies": [
                    "MASimple@tv-basicstudies" // 単純移動平均線 (SMA) をデフォルトで表示
                  ],
                  "container_id": "tradingview_chart"
                }
                );
                </script>
            </div>
        </article>

    </main>
</body>
</html>
