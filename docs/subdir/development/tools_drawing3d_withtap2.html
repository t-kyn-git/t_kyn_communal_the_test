<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>3D Drawing Tool with Three.js</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  button { margin: 5px; }
  canvas { display: block; }
</style>
</head>
<body>
  <h1>3D Drawing Tool with Three.js</h1>
  <button onclick="exportData()">エクスポート</button>
  <input type="file" id="importFile" accept=".json" onchange="importData(event)">
  <div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>
let scene, camera, renderer;
let objects = []; // 3Dオブジェクトを管理

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("container").appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5).normalize();
    scene.add(light);

    // デモ用に立方体を追加
    addCube(0, 0, 0, 0xff0000);
    addCube(2, 1, -1, 0x0000ff);

    window.addEventListener("resize", onWindowResize);
}

function onWindowResize() {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

// 立方体を追加
function addCube(x, y, z, color=0x00ff00) {
    const geometry = new THREE.BoxGeometry(1,1,1);
    const material = new THREE.MeshPhongMaterial({color});
    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(x, y, z);
    scene.add(cube);
    objects.push(cube);
}

// エクスポート
function exportData() {
    const data = objects.map(obj => ({
        type: "cube",
        position: obj.position,
        rotation: obj.rotation,
        scale: obj.scale,
        color: obj.material.color.getHex()
    }));

    const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "scene.json";
    a.click();
    URL.revokeObjectURL(url);
}

// インポート
function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);

            // 既存オブジェクトをクリア
            objects.forEach(obj => scene.remove(obj));
            objects = [];

            data.forEach(item => {
                if (item.type === "cube") {
                    addCube(item.position.x, item.position.y, item.position.z, item.color);
                    const cube = objects[objects.length - 1];
                    cube.rotation.set(item.rotation._x, item.rotation._y, item.rotation._z);
                    cube.scale.set(item.scale.x, item.scale.y, item.scale.z);
                }
            });
        } catch (err) {
            alert("読み込み失敗: " + err);
        }
    };
    reader.readAsText(file);
}
</script>
</body>
</html>
