# name: Django CI

name: Django App Test

on:
  push:
    paths:
      - "**/content/**"
      - ".github/workflows/django.yml"
    branches:
      - main
      - "*_communal_the_test"
  pull_request:
    branches:
      - main

jobs:
  test-django:
    runs-on: ubuntu-latest

    steps:
      # リポジトリチェックアウト
      - uses: actions/checkout@v3

      # Python セットアップ
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # Django インストール
      - name: Install Django
        run: pip install django

      # 依存シェルスクリプトでアプリ起動
      - name: Start Django App
        run: |
          chmod +x /content/t_kyn_test_app/all_manage_t_kyn_deploy.sh
          /content/t_kyn_test_app/all_manage_t_kyn_deploy.sh &
          echo "Waiting for server to start..."
          sleep 10  # サーバ起動待機

      # curl でアクセス確認
      - name: Test MyApp
        run: |
          curl -kv http://localhost:8000/myapp


